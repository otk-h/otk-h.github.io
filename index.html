<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05070a" />
    <meta name="description" content="otk" />
    <title>otk</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="home">
    <a class="skip-link" href="#identity">跳至主页</a>
    <main id="identity" class="beacon">
      <canvas id="signal" class="signal" aria-hidden="true"></canvas>
      <div class="noise" aria-hidden="true"></div>
      <div class="frame" aria-hidden="true">
        <i class="corner corner--tl"></i><i class="corner corner--tr"></i>
        <i class="corner corner--bl"></i><i class="corner corner--br"></i>
        <span class="axis axis--x"></span><span class="axis axis--y"></span>
      </div>
      <div class="coordinates" aria-hidden="true"><span>−100</span><span>−50</span><span>0</span><span>50</span><span>100</span></div>
      <div class="wordmark-wrap">
        <h1 class="wordmark" aria-label="otk"><span>o</span><span>t</span><span class="wordmark__k">k</span></h1>
      </div>
      <nav class="portal" aria-label="主要链接">
        <a class="portal__github signal-link" data-signal="github" href="https://github.com/otk-h" target="_blank" rel="noopener noreferrer"><span>GitHub</span><span aria-hidden="true">↗</span></a>
        <div class="portal__index">
          <p aria-hidden="true">Index</p>
          <a class="signal-link" data-signal="lab" href="lab/"><span>Lab / Enter</span><span aria-hidden="true">↗</span></a>
          <a class="signal-link" data-signal="resume" href="resume/"><span>Résumé</span><span aria-hidden="true">↗</span></a>
          <a class="signal-link" data-signal="blog" href="blog/"><span>Blog</span><span aria-hidden="true">↗</span></a>
        </div>
      </nav>
      <div class="signature" aria-hidden="true"><span class="signature__pulse"></span><span>OTK / SIGNAL</span></div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
