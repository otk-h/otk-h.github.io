<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>otk's web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container">
        <a class="brand" href="#home">otk's web</a>
        <ul class="nav-links">
          <li><a href="#about">关于</a></li>
          <li><a href="#projects">项目</a></li>
          <li><a href="#contact">联系</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="home" class="hero container card">
        <h1>Hi, I'm otk</h1>
        <a href="#projects" class="btn-primary">查看作品</a>
      </section>

      <section id="about" class="container section card">
        <h2>关于我</h2>
        <p>我是otk</p>
      </section>

      <section id="projects" class="container section">
        <h2>项目展示</h2>
        <div id="projectGrid" class="project-grid"></div>
      </section>

      <section id="skills" class="container section card">
        <h2>技能</h2>
        <div class="skills-grid">
          <div class="skill-item">
            <div class="skill-header"><i class="fa-brands fa-html5"></i><span>C</span></div>
            <div class="progress"><span style="width: 92%"></span></div>
          </div>
          <div class="skill-item">
            <div class="skill-header"><i class="fa-brands fa-css3-alt"></i><span>C++</span></div>
            <div class="progress"><span style="width: 95%"></span></div>
          </div>
          <div class="skill-item">
            <div class="skill-header"><i class="fa-brands fa-js"></i><span>Java</span></div>
            <div class="progress"><span style="width: 85%"></span></div>
          </div>
          <div class="skill-item">
            <div class="skill-header"><i class="fa-brands fa-react"></i><span>Rust</span></div>
            <div class="progress"><span style="width: 78%"></span></div>
          </div>
        </div>
      </section>

      <section id="blog" class="container section card">
        <div class="blog-header">
          <h2>博客空间</h2>
          <button id="addPostBtn" class="btn-secondary" type="button">添加文章</button>
        </div>
        <div id="blogList" class="blog-grid" aria-live="polite"></div>
      </section>

      <section id="contact" class="container section card">
        <h2>联系我</h2>
        <p>邮箱：<a href="mailto:otk_h@outlook.com">otk_h@outlook.com</a></p>
        <div class="social-links">
          <a href="https://github.com/otk-h" target="_blank" rel="noopener" aria-label="GitHub">
            <i class="fa-brands fa-github"></i>
          </a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 otk. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
