<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#05070a">
    <title>Event Horizon / otk lab</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body class="lab">
    <main class="beacon">
      <canvas id="signal" class="signal" aria-hidden="true"></canvas>
      <div class="frame" aria-hidden="true"></div>
      <header class="lab-heading"><a href="../">otk / HOME ↖</a><p>INTERACTIVE STUDY</p><h1>Event<br>Horizon.</h1><p>光、轨道与引力的视觉实验</p></header>
      <form class="lab-controls" hidden>
        <label for="angle">观察角度 <output for="angle" id="angle-value">0.29</output></label>
        <input id="angle" name="angle" type="range" min="0.1" max="0.7" step="0.01" value="0.29">
        <label for="speed">旋转速度 <output for="speed" id="speed-value">1.00</output></label>
        <input id="speed" name="speed" type="range" min="0" max="3" step="0.05" value="1">
        <label for="density">粒子密度 <output for="density" id="density-value">1.00</output></label>
        <input id="density" name="density" type="range" min="0.3" max="1.6" step="0.1" value="1">
        <button type="reset">恢复默认 ↺</button>
        <p>艺术化呈现，非物理模拟。</p>
      </form>
      <button class="observe" type="button" aria-pressed="false" hidden>减速观察 <span>HOLD SPACE</span></button>
      <noscript><p class="lab-controls">启用 JavaScript 后即可调整黑洞参数。</p></noscript>
    </main>
    <script src="../script.js"></script>
  </body>
</html>
